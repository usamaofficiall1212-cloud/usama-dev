<body>
<header class="top">
  <div class="bar wrap">
    <a class="brand" href="#top">Usama Mughal</a>
    <nav aria-label="Primary" id="nav">
      <a href="#work">Work</a><a href="#about">About</a><a href="#skills">Skills</a><a href="#contact">Contact</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Switch color theme">Dark</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="top">
    <div class="hero-text">
      <h1 id="h-title"></h1>
      <p id="h-intro"></p>
      <div class="cta" id="h-cta"></div>
      <p class="stack" id="h-stack"></p>
    </div>
    <div class="hero-phone" id="h-phone"></div>
  </section>

  <section id="work" aria-labelledby="work-h">
    <h2 id="work-h">Selected work</h2>
    <div id="projects"></div>
  </section>

  <section id="about" aria-labelledby="about-h">
    <h2 id="about-h">About</h2>
    <div class="about">
      <p id="about-text"></p>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>

  <section id="skills" aria-labelledby="skills-h">
    <h2 id="skills-h">Skills</h2>
    <div class="skills" id="skill-groups"></div>
  </section>

  <section id="contact" aria-labelledby="contact-h">
    <h2 id="contact-h">Contact</h2>
    <div class="contact-grid">
      <div>
        <p class="lead">I’m open to mobile development roles and freelance projects. Send a message here or use the links below.</p>
        <div class="links" id="links"></div>
      </div>
      <form class="form" id="contact-form" novalidate>
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn primary" type="submit">Send message</button>
        <p class="status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
  <footer>© <span id="yr"></span> Muhammad Usama Mughal</footer>
</main>

<dialog id="lightbox" aria-label="Screenshot viewer">
  <div class="lb">
    <button class="lb-btn" id="lb-prev" type="button" aria-label="Previous screenshot">‹</button>
    <img id="lb-img" alt="">
    <button class="lb-btn" id="lb-next" type="button" aria-label="Next screenshot">›</button>
    <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close">×</button>
  </div>
</dialog>

<dialog id="case" aria-label="Case study">
  <article class="case">
    <button class="case-close" id="case-close" type="button" aria-label="Close case study">×</button>
    <div id="case-body"></div>
  </article>
</dialog>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
